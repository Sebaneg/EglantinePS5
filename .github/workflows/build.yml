name: build-eden
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config python3 clang-18 llvm-18 lld-18 \
            libssl-dev zlib1g-dev nasm yasm autoconf automake libtool curl unzip xz-utils zstd
      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          make 2>&1 | tee make.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado
          path: |
            build/
            make.log
          if-no-files-found: warn
